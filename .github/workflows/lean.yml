name: Lean

# Check the Lean 4 code that Equations.jl generates against Mathlib: lean/generate.jl writes the
# theorems, and `lake build` type-checks them and runs the proofs that are not `sorry`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2

      - name: Generate the Lean code
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=. lean/generate.jl

      # lean/lakefile.toml follows Mathlib's master branch, so use the Lean version it needs
      - name: Use Mathlib's Lean version
        run: curl -sSfL https://raw.githubusercontent.com/leanprover-community/mathlib4/master/lean-toolchain -o lean/lean-toolchain

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          use-mathlib-cache: true
          build: true
